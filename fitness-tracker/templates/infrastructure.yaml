apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: fitness-gateway
spec:
  gatewayClassName: eg
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fitness-config
data:
  MONGO_HOST: "mongodb-service"
  PORT: "8080"
---
apiVersion: v1
kind: Secret
metadata:
  name: fitness-secrets
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: {{ .Values.database.username | quote }}
  MONGO_INITDB_ROOT_PASSWORD: {{ .Values.database.password | quote }}